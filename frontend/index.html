<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Inter was named in the stylesheet but never actually loaded, so every
         page was falling back to the system UI font. Preconnect first: the
         font files come from a second origin, and without it the browser waits
         for the CSS to resolve before it even opens that connection. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Matches the "Shimgen | {page}" the router sets once React mounts, so
         the tab does not flash a long marketing title first. Link unfurls read
         og:title below, which stays descriptive. -->
    <title>Shimgen | Home</title>
    <meta
      name="description"
      content="Free tournament bracket generator and random team generator. Create single or double elimination brackets, round robin and Swiss tournaments, split players into balanced teams, and keep stats boards that track wins across game nights. No sign-up needed."
    />

    <!-- The phrases people actually type. Search engines no longer read the
         keywords meta tag, so the terms live where they are read instead: in
         the title, the description and the visible copy on each page. -->
    <link rel="canonical" href="https://shimgen.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Paints the browser chrome to match the dark theme instead of leaving a
         white bar above the page on mobile. -->
    <meta name="theme-color" content="#16181f" />

    <!-- Spectator links get pasted straight into Discord, so the unfurl is a
         real part of the product rather than an afterthought. -->
    <meta property="og:site_name" content="Shimgen" />
    <meta property="og:title" content="Shimgen: Tournaments, Teams &amp; Stats for Game Night" />
    <meta
      property="og:description"
      content="Generate balanced teams, build a tournament bracket in seconds, and track wins, losses and trophies on stats boards that update themselves. Free, no sign-up needed."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shimgen.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shimgen: Tournaments, Teams &amp; Stats for Game Night" />
    <meta
      name="twitter:description"
      content="Generate balanced teams, build a tournament bracket in seconds, and track wins, losses and trophies on stats boards that update themselves. Free, no sign-up needed."
    />

    <!-- Structured data. Tells search engines this is a free web application
         rather than a page about one, which is what earns the richer result
         with a price and category shown under the link. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Shimgen",
        "url": "https://shimgen.com/",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Any",
        "description": "Free tournament bracket generator, random team generator and stats tracker for recurring game nights.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Tournament bracket generator",
          "Single and double elimination brackets",
          "Round robin and Swiss tournaments",
          "Random team generator",
          "Stats boards and leaderboards"
        ]
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
